name: Scrape events

on:
  schedule:
    - cron: "20 11 * * *"   # ~05:20 America/Chicago daily
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write
  actions: read     # lets the Worker relay confirm this run is live (see below)

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          # refresh: relay sources (they refuse GitHub's IPs) are fetched through
          # the site's Cloudflare Worker. The Worker accepts this run's own
          # short-lived token only while the run is in progress (docs/DEPLOY.md §10).
          RELAY_URL: https://northland-events.cbrown21.workers.dev/api/relay
          RELAY_TOKEN: ${{ github.token }}
          RELAY_RUN: ${{ github.run_id }}
        working-directory: scraper
        run: python main.py scrape

      - name: Commit refreshed data
        run: |
          git config user.name "northland-events-bot"
          git config user.email "actions@users.noreply.github.com"
          # moderation/*.csv is owner-written (admin page); CI never commits it.
          # sources/sources.yaml changes only when a potential source auto-promotes.
          git add site/data/events.json site/data/review_queue.json site/data/decisions.csv \
                  site/data/event_history.json site/data/recurring_events.json \
                  site/data/scrape_stats_history.json site/data/sources.json \
                  scraper/output/last_run.json scraper/output/source_cache.json \
                  scraper/output/source_history.json sources/sources.yaml
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: refresh events $(date -u +%Y-%m-%d)"
          # another push (a manual commit, or the review-queue edit) may have
          # landed while this run was scraping — rebase our data commit on top
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "push $attempt rejected — rebasing on origin/main"
            # in a rebase "ours" = origin: if an admin-page commit (tier change,
            # decision) touched the same lines while we scraped, the owner wins
            git pull --rebase --autostash --strategy-option=ours origin main
          done
          echo "push failed after retries"; exit 1
