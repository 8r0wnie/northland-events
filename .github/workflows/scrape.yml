name: Scrape events

on:
  schedule:
    - cron: "20 11 * * *"   # ~05:20 America/Chicago daily
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        working-directory: scraper
        run: python main.py scrape

      - name: Commit refreshed data
        run: |
          git config user.name "northland-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/events.json site/data/review_queue.json site/data/decisions.csv \
                  scraper/output/last_run.json moderation/decisions.csv
          git diff --staged --quiet || git commit -m "data: refresh events $(date -u +%Y-%m-%d)"
          git push
