name: Scraper tests

on:
  push:
    paths: ["scraper/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scraper/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Run regression tests (no network)
        working-directory: scraper
        run: python tests/test_posts.py && python tests/test_tiers.py
