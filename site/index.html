<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northland Events</title>
<meta name="description" content="Community events across the Duluth region — Northern Minnesota, Northwest Wisconsin, and the western U.P.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font:15px/1.5 var(--font);
         background: var(--bg); color: var(--ink); }
  header { padding: 20px 0 18px; background: var(--band); color: var(--band-ink);
           border-bottom: 4px solid var(--pbs-blue); }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  header p { margin: 4px 0 0; color: var(--band-muted); font-size: 13.5px; }
  .wrap > .filters:first-child { margin-top: 18px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .filters select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--panel); color: var(--ink); font-size: 14px; }
  .filters input[type="search"] { flex: 1 1 200px; min-width: 160px; padding: 7px 10px;
                    border: 1px solid var(--line); border-radius: 8px;
                    background: var(--panel); color: var(--ink); font-size: 14px; }
  .filters input[type="search"]::placeholder { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
                   padding: 2px 4px; border-radius: 6px; }
  .legend .item.off { opacity: .35; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  #calendar { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
              padding: 12px; }
  .fc-event { cursor: pointer; border-width: 0 !important; }
  .fc-daygrid-event, .fc-timegrid-event, .fc-list-event-dot { border: none !important; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  dialog { border: none; background: var(--panel); color: var(--ink); border-radius: 12px; padding: 0; max-width: 460px; width: 92vw;
           box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(10,20,90,.5); }
  .card { padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
  .card .when { color: var(--accent); font-weight: 600; font-size: 14px; }
  .card .where { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .card p { font-size: 14px; white-space: pre-wrap; }
  .card a.src { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 600;
                text-decoration: none; }
  .card .tag { display: inline-block; background: var(--bg); border: 1px solid var(--line);
               border-radius: 999px; padding: 2px 9px; font-size: 12px; margin-right: 6px; }
  .card .tag.cat { border: none; font-weight: 600; }
  dialog { max-height: 92vh; overflow: auto; }
  .report-link { display: block; margin-top: 14px; padding: 0; border: none; background: none;
                 color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .report { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .report h3 { margin: 0 0 4px; font-size: 15px; }
  .report label { display: block; margin: 9px 0 3px; color: var(--muted); font-size: 13px; }
  .report label.inline { display: flex; gap: 6px; align-items: center; }
  .report select, .report input:not([type="checkbox"]), .report textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; }
  .report .row { display: flex; gap: 8px; }
  .report .row > div { flex: 1; min-width: 0; }
  .report .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .report .send { margin-top: 12px; padding: 8px 16px; border: none; border-radius: 8px;
                  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; cursor: pointer; }
  .report .send:disabled { opacity: .6; cursor: default; }
  .report .msg { margin-top: 8px; font-size: 13px; }
  .report .msg.bad { color: var(--no); }
  .report .thanks { color: var(--ok); font-weight: 600; }
  .card button.close { position: absolute; top: 10px; right: 12px; border: none; background: none;
                       font-size: 22px; cursor: pointer; color: var(--muted); }
  @media (max-width: 600px) {
    #calendar { padding: 8px; }
    .fc .fc-toolbar { flex-wrap: wrap; gap: 8px; justify-content: center; }
    .fc .fc-toolbar-title { font-size: 1.3em; }
    .fc .fc-list-table { table-layout: fixed; }
    .fc .fc-list-event-time { width: 38%; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <h1>Northland Events</h1>
    <p>Community events across the Duluth region — Northern Minnesota, Northwest Wisconsin, and Ironwood, MI.</p>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <input type="search" id="search" placeholder="Search events…" autocomplete="off">
    <select id="area"><option value="">All areas</option></select>
    <select id="category"><option value="">All categories</option></select>
  </div>
  <div class="legend" id="legend"></div>
  <div id="calendar"></div>
  <p class="meta" id="stamp"></p>
</div>

<dialog id="detail"><div class="card">
  <button class="close" aria-label="Close" onclick="detail.close()">&times;</button>
  <div id="detail-body"></div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
const CAT_LABELS = {
  "music":"Music","arts":"Arts & Theater","family":"Family","food-drink":"Food & Drink",
  "sports-rec":"Sports & Rec","community":"Community","education":"Classes & Talks",
  "holiday":"Holiday","other":"Other"
};
// The five categories people actually browse by get their own distinct color;
// everything more procedural (meetings, classes, seasonal notices, catch-all)
// shares one neutral so it recedes instead of adding a sixth-through-ninth hue.
const CAT_COLORS = {
  "music":      { bg: "#E69F00", text: "#1a1206" },
  "sports-rec": { bg: "#009E73", text: "#04150f" },
  "arts":       { bg: "#CC79A7", text: "#1f0e18" },
  "family":     { bg: "#56B4E9", text: "#071b26" },
  "food-drink": { bg: "#D55E00", text: "#1a0c00" },
};
const CAT_OTHER = { bg: "#64748b", text: "#ffffff" };
function catColor(cat) { return CAT_COLORS[cat] || CAT_OTHER; }

let ALL = [];
let LAST_UPDATED = '';
const areaSel = document.getElementById('area');
const catSel = document.getElementById('category');
const searchBox = document.getElementById('search');
const detail = document.getElementById('detail');

function matchesSearch(e, q) {
  if (!q) return true;
  const hay = [e.title, e.description, e.venue, e.city, e.area,
               ...(e.sources || []).map(s => s.name)]
    .filter(Boolean).join(' \n ').toLowerCase();
  return q.split(/\s+/).filter(Boolean).every(term => hay.includes(term));
}

function fmtRange(startISO, endISO, allDay) {
  const s = new Date(startISO);
  const opts = { weekday:'short', month:'short', day:'numeric' };
  let out = s.toLocaleDateString(undefined, opts);
  if (!allDay) out += ' · ' + s.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  if (endISO) {
    const e = new Date(endISO);
    if (e.toDateString() === s.toDateString() && !allDay)
      out += '–' + e.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
    else if (e.toDateString() !== s.toDateString())
      out += ' – ' + e.toLocaleDateString(undefined, opts);
  }
  return out;
}

function openDetail(ev) {
  const b = document.getElementById('detail-body');
  b.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = ev.title; b.appendChild(h);
  const when = document.createElement('div'); when.className = 'when';
  when.textContent = fmtRange(ev.start, ev.end, ev.all_day); b.appendChild(when);
  const where = document.createElement('div'); where.className = 'where';
  where.textContent = [ev.venue, ev.city || ev.area].filter(Boolean).join(' · '); b.appendChild(where);
  const tags = document.createElement('div');
  if (ev.category) {
    const c = catColor(ev.category);
    tags.innerHTML += `<span class="tag cat" style="background:${c.bg};color:${c.text}">${CAT_LABELS[ev.category]||ev.category}</span>`;
  }
  if (ev.price) tags.innerHTML += `<span class="tag">${ev.price}</span>`;
  b.appendChild(tags);
  if (ev.description) { const p = document.createElement('p'); p.textContent = ev.description; b.appendChild(p); }
  if (ev.url) {
    const a = document.createElement('a'); a.className = 'src'; a.href = ev.url; a.target = '_blank';
    a.rel = 'noopener'; a.textContent = 'Event details ↗'; b.appendChild(a);
  }
  const src = document.createElement('div'); src.className = 'meta';
  const list = (ev.sources || []).map(s => s.name).filter(Boolean);
  if (ev.verification === 'reviewed') {
    src.textContent = 'Added after manual review';
  } else if (list.length >= 2) {
    src.textContent = 'Confirmed by ' + list.length + ' sources: ' + list.join(', ');
  } else if (list.length === 1) {
    src.textContent = 'Source: ' + list[0];
  }
  if (src.textContent) b.appendChild(src);
  const rep = document.createElement('button'); rep.type = 'button'; rep.className = 'report-link';
  rep.textContent = 'Report a problem with this event';
  rep.onclick = () => { rep.replaceWith(reportForm(ev)); };
  b.appendChild(rep);
  detail.showModal();
}

// ── "Report a problem": goes to the editor's review queue (/api/report) ──────
const REPORT_KINDS = [
  ['when', 'Wrong date or time'],
  ['category', 'Wrong category'],
  ['location', 'Wrong place (venue, city or state)'],
  ['title', 'Wrong title or description'],
  ['cancelled', 'Cancelled or postponed'],
  ['duplicate', 'Listed more than once'],
  ['not-public', 'Not a public event, or spam'],
  ['link', "The link doesn't work"],
  ['other', 'Something else'],
];
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function reportForm(ev) {
  const opened = Date.now();
  const f = document.createElement('form'); f.className = 'report'; f.noValidate = true;
  const sameDay = ev.end && ev.end.slice(0, 10) === ev.start.slice(0, 10);
  const cats = Object.entries(CAT_LABELS).map(([k, v]) =>
    `<option value="${k}" ${k === ev.category ? 'selected' : ''}>${escHtml(v)}</option>`).join('');
  f.innerHTML = `
    <h3>Report a problem</h3>
    <label for="rk">What's wrong?</label>
    <select id="rk" name="kind" required><option value="">Choose one…</option>
      ${REPORT_KINDS.map(([k, v]) => `<option value="${k}">${escHtml(v)}</option>`).join('')}</select>
    <div data-for="when" hidden>
      <div class="row">
        <div><label for="rd">Correct date</label><input id="rd" name="date" type="date" value="${escHtml(ev.start.slice(0, 10))}"></div>
      </div>
      <div class="row">
        <div><label for="rs">Starts</label><input id="rs" name="start" type="time" value="${ev.all_day ? '' : escHtml(ev.start.slice(11, 16))}"></div>
        <div><label for="re">Ends</label><input id="re" name="end" type="time" value="${!ev.all_day && sameDay ? escHtml(ev.end.slice(11, 16)) : ''}"></div>
      </div>
      <label class="inline"><input type="checkbox" name="all_day" ${ev.all_day ? 'checked' : ''}> All day</label>
    </div>
    <div data-for="category" hidden>
      <label for="rc">Better category</label><select id="rc" name="category">${cats}</select>
    </div>
    <div data-for="location" hidden>
      <label for="rv">Venue</label><input id="rv" name="venue" maxlength="150" value="${escHtml(ev.venue)}">
      <div class="row">
        <div><label for="rci">City</label><input id="rci" name="city" maxlength="80" value="${escHtml(ev.city)}"></div>
        <div><label for="rst">State</label><select id="rst" name="state">
          ${['MN', 'WI', 'MI', 'Other'].map(s => `<option ${s === ev.state ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
    </div>
    <div data-for="title" hidden>
      <label for="rt">Correct title</label><input id="rt" name="title" maxlength="200" value="${escHtml(ev.title)}">
    </div>
    <div data-for="link" hidden>
      <label for="ru">Working link, if you know one (optional)</label><input id="ru" name="url" type="url" maxlength="300" placeholder="https://…">
    </div>
    <label for="rn">Anything else we should know? (optional)</label>
    <textarea id="rn" name="note" rows="3" maxlength="600" placeholder="e.g. The flyer says it starts at 7, not 6."></textarea>
    <label for="rm">Your email, if you're OK with a follow-up question (optional)</label>
    <input id="rm" name="contact" type="email" maxlength="120" autocomplete="email">
    <div class="hp" aria-hidden="true"><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="send" type="submit">Send report</button>
    <div class="msg" role="status"></div>
    <p class="meta">Reports go to the calendar's editor, who checks them before anything changes. Your email is only seen by the editor.</p>`;
  const kindSel = f.elements.kind, msg = f.querySelector('.msg');
  kindSel.onchange = () => {
    for (const d of f.querySelectorAll('[data-for]')) d.hidden = d.dataset.for !== kindSel.value;
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(f), kind = fd.get('kind');
    if (!kind) { msg.className = 'msg bad'; msg.textContent = "Please choose what's wrong."; kindSel.focus(); return; }
    const pick = names => Object.fromEntries(names.map(n => [n, (fd.get(n) || '').trim()]).filter(([, v]) => v));
    const value = kind === 'when' ? { ...pick(['date', 'start', 'end']), all_day: !!fd.get('all_day') }
      : kind === 'category' ? pick(['category'])
      : kind === 'location' ? pick(['venue', 'city', 'state'])
      : kind === 'title' ? pick(['title'])
      : kind === 'link' ? pick(['url']) : {};
    const btn = f.querySelector('.send'); btn.disabled = true;
    msg.className = 'msg'; msg.textContent = 'Sending…';
    try {
      const r = await fetch('/api/report', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ event: ev.fingerprint, kind, value, note: fd.get('note') || '',
          contact: fd.get('contact') || '', website: fd.get('website') || '', elapsed_ms: Date.now() - opened }) });
      let data = {}; try { data = await r.json(); } catch {}
      if (!r.ok) throw new Error(data.error || `Something went wrong (${r.status}).`);
      const done = document.createElement('div'); done.className = 'report';
      done.innerHTML = '<p class="thanks">Thanks! The calendar editor will check it.</p>';
      f.replaceWith(done);
    } catch (err) {
      msg.className = 'msg bad'; msg.textContent = err.message; btn.disabled = false;
    }
  };
  setTimeout(() => kindSel.focus(), 0);
  return f;
}

function applyFilters(cal) {
  const a = areaSel.value, c = catSel.value;
  const q = searchBox.value.trim().toLowerCase();
  cal.removeAllEvents();
  const shown = ALL.filter(e => (!a || e.area === a) && (!c || e.category === c) && matchesSearch(e, q));
  cal.addEventSource(shown
    .map(e => {
      const col = catColor(e.category);
      return {
        title: e.title, start: e.start, end: e.end, allDay: e.all_day, extendedProps: e,
        backgroundColor: col.bg, borderColor: col.bg, textColor: col.text,
      };
    }));
  renderLegend();
  const stamp = document.getElementById('stamp');
  stamp.textContent = (q || a || c)
    ? `${shown.length} of ${ALL.length} events match`
    : `${ALL.length} events · updated ${LAST_UPDATED}`;
}

function renderLegend(categories) {
  const legend = document.getElementById('legend');
  const cats = categories || Array.from(catSel.options).slice(1).map(o => o.value);
  legend.innerHTML = '';
  for (const cat of cats) {
    const col = catColor(cat);
    const item = document.createElement('span');
    item.className = 'item' + (catSel.value && catSel.value !== cat ? ' off' : '');
    item.innerHTML = `<span class="dot" style="background:${col.bg}"></span>${CAT_LABELS[cat] || cat}`;
    item.onclick = () => {
      catSel.value = (catSel.value === cat) ? '' : cat;
      catSel.dispatchEvent(new Event('change'));
    };
    legend.appendChild(item);
  }
}

fetch('data/events.json').then(r => r.json()).then(data => {
  ALL = data.events || [];
  LAST_UPDATED = new Date(data.generated).toLocaleString();
  for (const area of data.areas || []) areaSel.add(new Option(area, area));
  for (const cat of data.categories || []) catSel.add(new Option(CAT_LABELS[cat] || cat, cat));

  const cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: window.innerWidth < 640 ? 'listMonth' : 'dayGridMonth',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listMonth' },
    height: 'auto',
    eventDisplay: 'block',
    eventClick: info => { info.jsEvent.preventDefault(); openDetail(info.event.extendedProps); },
  });
  cal.render();
  applyFilters(cal);
  areaSel.onchange = () => applyFilters(cal);
  catSel.onchange = () => applyFilters(cal);
  let searchTimer;
  searchBox.oninput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => applyFilters(cal), 150);
  };
}).catch(err => {
  document.getElementById('calendar').textContent = 'Could not load events. ' + err;
});
</script>
</body>
</html>
