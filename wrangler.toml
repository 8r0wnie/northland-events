name = "northland-events"
compatibility_date = "2026-09-04"
# worker/index.js answers /api/* (the admin API); everything else is a static
# file from site/, served exactly as before. See docs/DEPLOY.md §9.
main = "worker/index.js"

[assets]
directory = "./site"
binding = "ASSETS"

[vars]
GITHUB_REPO = "8r0wnie/northland-events"
GITHUB_BRANCH = "main"
# Community reports inbox (docs/DEPLOY.md §11). Uncomment once the owner has
# created the KV namespace and shared its id:
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "<namespace id>"

# Secrets (set in the Cloudflare dashboard, never committed):
#   ADMIN_PASSWORD, GITHUB_TOKEN
