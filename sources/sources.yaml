  # ─────────────────────────── Venues — fairgrounds & county fairs (added 2026-09) ───────────────────────────
  # Requested by name: identify local fairgrounds we hadn't considered. Most of
  # these are single-annual-event promo sites rather than full calendars.
  # Second pass (2026-09): read the actual page text behind each 0-event
  # result before writing a bespoke scraper for it. Verdict: not worth it for
  # most of these specifically *because* they're single-annual-date pages —
  # Iron County Heritage Days' own text runs two adjacent date mentions
  # together into one nonsense range, and St. Louis County's page was still
