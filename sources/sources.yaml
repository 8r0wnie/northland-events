# Northland Events — source registry
#
# Every site we may scrape for events, from "Region Event Website Appendix.pdf".
# Fields:
#   id         stable slug (used in event provenance)
#   name       human label
#   url        site root
#   events_url calendar/events page once discovered (blank = needs triage)
#   category   gov | chamber | tourism | news | venue
#   state      MN | WI | MI
#   area       city/region label surfaced as a filter in the UI
#   platform   detected CMS once known (civicplus, revize, govoffice, chambermaster,
#              growthzone, simpleview, wordpress-tribe, localist, ...) — drives adapter choice
#   status     todo | active | no-calendar | blocked | broken
#   notes      anything useful
#
# The scraper reads this file; `status: active` + a working adapter = it gets crawled.

sources:

